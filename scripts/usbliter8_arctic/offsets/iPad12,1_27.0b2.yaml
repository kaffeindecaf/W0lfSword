blockers:
  kernel:
    entries: 18
    reason: >-
      kernelcache offsets are per component: iPad 9 boots kernelcache.release.ipad12p, while these
      values were copied from iPhone12,3 (kernelcache.release.iphone12). No verified ipad12p offsets
      exist yet and the wiki publishes no kernelcache key for iPad12,x, so they cannot be derived
      offline. The builder refuses this section until real ipad12p offsets are contributed.
    needs: a contributor with an iPad 9 (derive/verify the 18 kernel sites), or a published ipad12p key
