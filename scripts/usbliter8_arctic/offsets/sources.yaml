rp2350_boards:
  - id: "pico2"
    name: "Raspberry Pi Pico 2"
    uf2_file: "usbliter8.pico2.uf2"
    pins: {Dplus: "GP12", Dminus: "GP13", VBUS: "VBUS", GND: "GND"}
    soldering: true
    note: "Most common. Requires soldering a cut Lightning-to-USB-A cable."

  - id: "waveshare_usb_a"
    name: "Waveshare RP2350-USB-A"
    uf2_file: "usbliter8.waveshare_rp2350_usb_a.uf2"
    pins: {Dplus: "built-in USB-A host port", Dminus: "built-in USB-A host port"}
    soldering: false
    note: "RECOMMENDED. Built-in USB-A host port — no soldering needed. Plug Lightning cable directly."

  - id: "waveshare_usb_c"
    name: "Waveshare RP2350-USB-C"
    uf2_file: "usbliter8.waveshare_rp2350_usb_c.uf2"
    pins: {Dplus: "GP12", Dminus: "GP13", VBUS: "VBUS", GND: "GND"}
    soldering: true
    note: "Small form factor. Requires soldering."

  - id: "waveshare_zero"
    name: "Waveshare RP2350-Zero"
    uf2_file: "usbliter8.waveshare_rp2350_zero.uf2"
    pins: {Dplus: "GP12", Dminus: "GP13", VBUS: "VBUS", GND: "GND"}
    soldering: true
    note: "Ultra-compact. Requires soldering."

  - id: "waveshare_pizero"
    name: "Waveshare RP2350-Pizero"
    uf2_file: "usbliter8.waveshare_rp2350_pizero.uf2"
    pins: {Dplus: "GP12", Dminus: "GP13", VBUS: "VBUS", GND: "GND"}
    soldering: true
    note: "Pi Zero form factor. Requires soldering."

  - id: "pimoroni_tiny2350"
    name: "Pimoroni Tiny2350"
    uf2_file: "usbliter8.pimoroni_tiny2350.uf2"
    pins: {Dplus: "GP12", Dminus: "GP13", VBUS: "VBUS", GND: "GND"}
    soldering: true
    note: "Tiny board. Requires soldering."
