# Template for new device offset configuration.
# Copy this file, rename to <Model>_<iOS>.yaml (the name must match model +
# ios_version), then replace each DEADBEEF sentinel and drop its `pending: true`.
#
#   python3 device_offsets.py validate offsets/<file>.yaml   # exits 1 while entries are invalid
#   python3 safety_check.py                                  # also checks the file name and evidence
#
# Keep `pending: true` on any entry you have not discovered yet: pending entries
# are skipped by validation and by the flash gate instead of being treated as
# real offsets. Never flash a profile that still has pending entries, and use
# `blockers:` for data that exists but must not be applied (for example kernel
# offsets belonging to a different kernelcache component).

device: "Device Name"
model: "iPhone00,0"
ios_version: "27.0"
build: "00A0000h"
soc: "A12 or A13"
board: "board_ap"
apticket: "t8020 or t8030"
verification: pending

patches:
  ibss:
    image4_validate_nop:   { offset: 0xDEADBEEF, value: "1f2003d5", pending: true }
    image4_validate_ret0:  { offset: 0xDEADBEEF, value: "000080d2", pending: true }
    boot_args_adrp:        { offset: 0xDEADBEEF, value: "????????", pending: true }
    boot_args_add:         { offset: 0xDEADBEEF, value: "????????", pending: true }
    boot_args_string:      { offset: 0xDEADBEEF, value: "-v wdt=-1 rd=md0 -restore", pending: true }

  ibec:
    keep_nonce_b:          { offset: 0xDEADBEEF, value: "28000014", pending: true }
    image4_validate_nop:   { offset: 0xDEADBEEF, value: "1f2003d5", pending: true }
    image4_validate_ret0:  { offset: 0xDEADBEEF, value: "000080d2", pending: true }
    boot_args_adrp:        { offset: 0xDEADBEEF, value: "????????", pending: true }
    boot_args_add:         { offset: 0xDEADBEEF, value: "????????", pending: true }
    boot_args_string:      { offset: 0xDEADBEEF, value: "-v wdt=-1 rd=md0 -restore", pending: true }

  kernel:
    - name: "USB Restricted Mode bypass"
      offset: 0xDEADBEEF
      value: "200080d2c0035fd6"
      pending: true
    - name: "Sandbox file_check_mmap"
      offset: 0xDEADBEEF
      value: "000080d2c0035fd6"
      pending: true
    - name: "AMFI trust everything"
      offset: 0xDEADBEEF
      value: "200080d2c0035fd6"
      pending: true

  devicetree:
    remove_content_protect: true
    add_no_effaceable_storage: true
    ephemeral_storage: true

  restoreramdisk:
    asr_sig_bypass:     { offset: 0xDEADBEEF, value: "1f2003d5", pending: true }
    fdr_force_succeed:  { offset: 0xDEADBEEF, value: "000080d2", pending: true }

  daemons:
    coreauthd:
      anti_sep_crash: { offset: 0xDEADBEEF, value: "1f2003d5", pending: true }
    ctkd:
      anti_sep_crash_ret0: { offset: 0xDEADBEEF, value: "000080d2", pending: true }
      anti_sep_crash_ret:  { offset: 0xDEADBEEF, value: "c0035fd6", pending: true }
    mobileactivationd:
      should_hactivate: { offset: 0xDEADBEEF, value: "20008052", pending: true }

  userland:
    disable_screentime: true
    disable_setup: true
